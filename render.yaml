services:
  - type: web
    name: the-love-media-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run signaling
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIGNALING_PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://the-love-media-6.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://the-love-media-6.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: the-love-media-db
          property: connectionString

  - type: static
    name: the-love-media
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://the-love-media-api.onrender.com
      - key: VITE_WS_URL
        value: wss://the-love-media-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: the-love-media-db
    plan: basic-256mb
